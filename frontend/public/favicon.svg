<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Deep Burgundy Circular Shield with Gold Trim -->
  <circle cx="50" cy="50" r="47" fill="#58111A" stroke="#D4AF37" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="#E5D2AD" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="2 2"/>

  <!-- Trikuta Mountain Peaks in Sacred Gold -->
  <!-- Flanking Left Peak -->
  <polygon points="18,68 35,42 48,68" fill="#B8860B" opacity="0.55"/>
  <!-- Flanking Right Peak -->
  <polygon points="52,68 65,42 82,68" fill="#B8860B" opacity="0.55"/>
  <!-- Central Summit Peak -->
  <polygon points="26,70 50,26 74,70" fill="url(#yatraGoldGrad)" opacity="0.95"/>
  <polygon points="50,26 50,70 74,70" fill="#7A4B08" opacity="0.25"/>

  <!-- Ascending Pilgrimage Path (Yatra) -->
  <path d="M44,78 Q50,64 47,54 T50,38" stroke="#FFFDF9" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Guiding AI Star / Divine Jyoti at Summit -->
  <circle cx="50" cy="22" r="3" fill="#FFFDF9"/>
  <path d="M50,15 L50,29 M43,22 L57,22" stroke="#E5D2AD" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M45,17 L55,27 M45,27 L55,17" stroke="#D4AF37" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Base Foundation Arc -->
  <path d="M22,76 C36,83 64,83 78,76" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <defs>
    <linearGradient id="yatraGoldGrad" x1="26" y1="26" x2="74" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF5EB"/>
      <stop offset="35%" stop-color="#E5D2AD"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>
</svg>
